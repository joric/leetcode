name: Scheduled Trigger
on:
  schedule:
    - cron: '05 20 * * *'
  workflow_dispatch:

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - name: Log current time before trigger
        run: |
          echo "=== Current Time Information ==="
          echo "UTC Time: $(date -u)"
          echo "Local Time: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Unix Timestamp: $(date +%s)"
          echo "================================"
      - name: Call reusable workflow
        uses: ./.github/workflows/update-data.yml
